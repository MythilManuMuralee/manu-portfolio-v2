name: Deploy to GitHub Pages

# Deploys the site on every push to main.
#
# configure-pages runs with enablement: true, so this workflow turns the
# Pages site on by API the first time it runs. That avoids needing anyone
# to set Source by hand in repository settings.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The whole repository is the site: plain HTML, no build step.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
